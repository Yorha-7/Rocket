name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libeigen3-dev libzip-dev libtinyxml2-dev pkg-config
    - name: configure
      run: cmake -S sim/rocket_cpp -B sim/rocket_cpp/build
    - name: build
      run: cmake --build sim/rocket_cpp/build
